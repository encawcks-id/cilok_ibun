<body>
<div id="app"></div>
<div class="toast-container" id="toasts"></div>
<div id="modal-root"></div>

<script>
// ==================== DATABASE LAYER ====================
const DB={
  _cache:{},
  _useFirebase:false,
  _db:null,
  _listenersSetup:false,
  _TABLES:['roles','users','categories','products','ingredients','recipes','purchases','sales','expenses','cash_transactions','stock_movements','suppliers','activity_log','promo','package_menu'],

  async connect(config){
    try{
      if(!firebase.apps.length) firebase.initializeApp(config);
      this._db=firebase.database();
      await this._db.ref('.info/connected').once('value');
      this._useFirebase=true;
      await this._loadAll();
      if(!this._listenersSetup) this._setupListeners();
      return true;
    }catch(e){
      console.error('Firebase gagal:',e);
      this._useFirebase=false;
      return false;
    }
  },

  async _loadAll(){
    await Promise.all(this._TABLES.map(async t=>{
      const snap=await this._db.ref(t).once('value');
      const data=snap.val();
      this._cache[t]=data?Object.values(data):[];
    }));
    const hasData=this._TABLES.some(t=>this._cache[t].length>0);
    if(!hasData){
      this._TABLES.forEach(t=>{
        try{const d=JSON.parse(localStorage.getItem('ci_'+t));if(d&&d.length)this._cache[t]=d}catch(e){}
      });
    }
  },

  _setupListeners(){
    this._listenersSetup=true;
    this._TABLES.forEach(t=>{
      this._db.ref(t).on('value',snap=>{
        const data=snap.val();
        this._cache[t]=data?Object.values(data):[];
      });
    });
  },

  disconnect(){
    if(this._db&&this._listenersSetup){
      this._TABLES.forEach(t=>{this._db.ref(t).off()});
      this._listenersSetup=false;
    }
    this._useFirebase=false;
  },

  isFirebase(){return this._useFirebase},

  _fbSet(t,data){
    if(!this._useFirebase)return;
    const obj={};data.forEach(item=>{obj[item.id]=item});
    this._db.ref(t).set(obj).catch(e=>console.error('Firebase write error ['+t+']:',e));
  },
  _fbSetOne(t,id,data){
    if(!this._useFirebase)return;
    this._db.ref(t+'/'+id).set(data).catch(e=>console.error('Firebase write error ['+t+'/'+id+']:',e));
  },
  _fbUpdate(t,id,data){
    if(!this._useFirebase)return;
    this._db.ref(t+'/'+id).update(data).catch(e=>console.error('Firebase update error ['+t+'/'+id+']:',e));
  },
  _fbRemove(t,id){
    if(!this._useFirebase)return;
    this._db.ref(t+'/'+id).remove().catch(e=>console.error('Firebase remove error ['+t+'/'+id+']:',e));
  },

  async setTable(t,data){
    this._cache[t]=data;
    if(this._useFirebase){
      const obj={};data.forEach(item=>{obj[item.id]=item});
      await this._db.ref(t).set(obj);
    }else{
      localStorage.setItem('ci_'+t,JSON.stringify(data));
    }
  },

  get(t){return this._cache[t]||[]},
  set(t,d){
    this._cache[t]=d;
    if(this._useFirebase){this._fbSet(t,d)}else{localStorage.setItem('ci_'+t,JSON.stringify(d))}
  },
  getOne(t){try{return JSON.parse(localStorage.getItem(t))}catch(e){return null}},
  setOne(t,d){localStorage.setItem(t,JSON.stringify(d))},
  nextId(t){const items=this.get(t);return items.length?Math.max(...items.map(i=>i.id))+1:1},
  add(t,item){
    const items=this.get(t);
    item.id=this.nextId(t);
    item.createdAt=new Date().toISOString();
    items.push(item);
    this._cache[t]=[...items];
    if(this._useFirebase){this._fbSetOne(t,item.id,item)}else{localStorage.setItem('ci_'+t,JSON.stringify(items))}
    return item;
  },
  update(t,id,data){
    const items=this.get(t);
    const idx=items.findIndex(i=>i.id===id);
    if(idx>-1){
      items[idx]={...items[idx],...data,updatedAt:new Date().toISOString()};
      this._cache[t]=[...items];
      if(this._useFirebase){this._fbUpdate(t,id,items[idx])}else{localStorage.setItem('ci_'+t,JSON.stringify(items))}
      return items[idx];
    }
    return null;
  },
  remove(t,id){
    const items=this.get(t).filter(i=>i.id!==id);
    this._cache[t]=items;
    if(this._useFirebase){this._fbRemove(t,id)}else{localStorage.setItem('ci_'+t,JSON.stringify(items))}
  },
  find(t,id){return this.get(t).find(i=>i.id===id)},
  query(t,fn){return this.get(t).filter(fn)},
  count(t,fn){return fn?this.get(t).filter(fn).length:this.get(t).length},
  sum(t,fn,field){return this.get(t).filter(fn).reduce((s,i)=>s+(Number(i[field])||0),0)},

  backup(){
    const data={};
    this._TABLES.forEach(t=>{data[t]=this._cache[t]||[]});
    ['ci_settings','ci_dark','ci_seeded'].forEach(k=>{const v=localStorage.getItem(k);if(v)data[k]=v});
    return data;
  },
  restore(data){
    Object.keys(data).forEach(k=>{
      if(k.startsWith('ci_')){localStorage.setItem(k,data[k])}
      else if(this._TABLES.includes(k)){this._cache[k]=data[k]}
    });
  }
};

// ==================== HELPER FUNCTIONS ====================
const fmt=n=>'Rp '+Number(n||0).toLocaleString('id-ID');
const fmtN=n=>Number(n||0).toLocaleString('id-ID');
const fmtD=d=>d?new Date(d).toLocaleDateString('id-ID',{day:'2-digit',month:'short',year:'numeric'}):'-';
const fmtDT=d=>d?new Date(d).toLocaleString('id-ID',{day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'}):'-';
const today=()=>new Date().toISOString().slice(0,10);
const weekStart=()=>{const d=new Date();const day=d.getDay();const diff=d.getDate()-day+(day===0?-6:1);return new Date(d.getFullYear(),d.getMonth(),diff).toISOString().slice(0,10)};
const monthStart=()=>new Date(new Date().getFullYear(),new Date().getMonth(),1).toISOString().slice(0,10);
const isToday=d=>d&&d.slice(0,10)===today();
const isThisWeek=d=>d&&d.slice(0,10)>=weekStart();
const isThisMonth=d=>d&&d.slice(0,10)>=monthStart();

function toast(msg,type='success'){
  const el=document.createElement('div');
  el.className='toast toast-'+type;
  el.textContent=msg;
  document.getElementById('toasts').appendChild(el);
  setTimeout(()=>el.remove(),3000);
}

function logActivity(action,detail=''){
  const u=Auth.user();
  if(!u)return;
  DB.add('activity_log',{userId:u.id,userName:u.name,action,detail});
}

function showModal(title,bodyHtml,footerHtml=''){
  document.getElementById('modal-root').innerHTML=
  '<div class="modal-overlay" onclick="if(event.target===this)closeModal()">'+
    '<div class="modal-box">'+
      '<div style="padding:20px 24px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between">'+
        '<h3 style="font-family:Space Grotesk;font-weight:700;font-size:18px">'+title+'</h3>'+
        '<button onclick="closeModal()" style="background:none;border:none;cursor:pointer;color:var(--text2);font-size:20px"><i class="fas fa-times"></i></button>'+
      '</div>'+
      '<div style="padding:24px">'+bodyHtml+'</div>'+
      (footerHtml?'<div style="padding:16px 24px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px">'+footerHtml+'</div>':'')+
    '</div>'+
  '</div>';
}
function closeModal(){document.getElementById('modal-root').innerHTML=''}

function confirmDialog(msg,onYes){
  showModal('Konfirmasi','<p style="font-size:15px">'+msg+'</p>',
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button>'+
    '<button class="btn btn-primary" id="btn-confirm-yes">Ya, Lanjutkan</button>');
  document.getElementById('btn-confirm-yes').onclick=async()=>{closeModal();await onYes()};
}

function filterTable(input,tableId){
  const filter=input.value.toLowerCase();
  const table=document.getElementById(tableId);
  if(!table)return;
  const rows=table.querySelectorAll('tbody tr');
  rows.forEach(row=>{
    const text=(row.getAttribute('data-search')||row.textContent).toLowerCase();
    row.style.display=text.includes(filter)?'':'none';
  });
}

function exportCSV(filename,headers,rows){
  let csv=headers.join(',')+'\n';
  rows.forEach(r=>{csv+=r.map(c=>'"'+String(c||'').replace(/"/g,'""')+'"').join(',')+'\n'});
  downloadFile(csv,filename,'text/csv');
}
function downloadFile(content,name,type){
  const b=new Blob([content],{type:type+';charset=utf-8'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;a.click();URL.revokeObjectURL(a.href);
}
function exportJSON(){
  const data=DB.backup();
  downloadFile(JSON.stringify(data,null,2),'cilok_ibun_backup_'+today()+'.json','application/json');
  toast('Backup berhasil diunduh');
}
function importJSON(file){
  const r=new FileReader();
  r.onload=e=>{
    try{
      const data=JSON.parse(e.target.result);
      DB.restore(data);
      toast('Data berhasil direstore');
      setTimeout(()=>location.reload(),500);
    }catch(err){toast('File tidak valid','error')}
  };
  r.readAsText(file);
}
function printElement(id){
  const el=document.getElementById(id);
  if(!el)return;
  const w=window.open('','','width=800,height=600');
  w.document.write('<html><head><title>Cetak</title><style>body{font-family:Plus Jakarta Sans,sans-serif;padding:20px;font-size:13px}table{width:100%;border-collapse:collapse}th,td{padding:6px 8px;border:1px solid #ddd;text-align:left}th{background:#f5f5f5;font-size:11px;text-transform:uppercase}.text-right{text-align:right}.text-center{text-align:center}</style></head><body>'+el.innerHTML+'</body></html>');
  w.document.close();w.print();
}

// ==================== AUTH MODULE ====================
const Auth={
  user(){const u=DB.getOne('ci_session');return u?DB.find('users',u.userId):null},
  login(username,password){
    const u=DB.query('users',u=>u.username===username&&u.password===password&&u.active)[0];
    if(u){DB.setOne('ci_session',{userId:u.id,loginAt:new Date().toISOString()});logActivity('Login','User '+u.name+' login');return u}
    return null;
  },
  logout(){logActivity('Logout','User logout');localStorage.removeItem('ci_session')},
  role(){const u=this.user();return u?u.role:'guest'},
  can(perm){
    const r=this.role();
    const perms={owner:['all'],kasir:['pos','qris','dashboard'],karyawan:['pos','dashboard']};
    const p=perms[r]||[];
    return p.includes('all')||p.includes(perm);
  }
};

// ==================== SEED DATA ====================
async function seedData(){
  if(DB.getOne('ci_seeded')&&!DB.isFirebase())return;

  await DB.setTable('roles',[{id:1,name:'Owner'},{id:2,name:'Kasir'},{id:3,name:'Karyawan'}]);
  await DB.setTable('users',[
    {id:1,username:'owner',password:'owner123',name:'Pemilik',role:'owner',active:true,createdAt:new Date().toISOString()},
    {id:2,username:'kasir',password:'kasir123',name:'Kasir 1',role:'kasir',active:true,createdAt:new Date().toISOString()},
    {id:3,username:'karyawan',password:'karyawan123',name:'Karyawan 1',role:'karyawan',active:true,createdAt:new Date().toISOString()}
  ]);
  await DB.setTable('categories',[
    {id:1,name:'Cilok'},{id:2,name:'Udang'},{id:3,name:'Sosis'},{id:4,name:'Lainnya'},{id:5,name:'Minuman'}
  ]);
  const prods=[

    {id:2,code:'CL002',name:'Cilok Mercon',categoryId:1,costPrice:600,sellPrice:2500,stock:80,active:true},
    {id:3,code:'CL003',name:'Cilok BBQ',categoryId:1,costPrice:600,sellPrice:2500,stock:80,active:true},
    {id:4,code:'CL004',name:'Cilok Balado',categoryId:1,costPrice:600,sellPrice:2500,stock:80,active:true},
    {id:5,code:'CL005',name:'Cilok Keju',categoryId:1,costPrice:800,sellPrice:3000,stock:60,active:true},
    {id:6,code:'UD001',name:'Udang Keju',categoryId:2,costPrice:2000,sellPrice:5000,stock:50,active:true},

// ==================== CALCULATIONS ====================
const Calc={
  hpp(productId){
    const recipe=DB.find('recipes',r=>r.productId===productId);
    if(!recipe||!recipe.details)return DB.find('products',productId)?.costPrice||0;
    let total=0;
    recipe.details.forEach(d=>{const ing=DB.find('ingredients',d.ingredientId);if(ing)total+=ing.price*d.qty});
    return Math.round(total);
  },
  margin(sellPrice,costPrice){return sellPrice>0?Math.round((sellPrice-costPrice)/sellPrice*100):0},
  todayRevenue(){return DB.sum('sales',s=>isToday(s.date),'total')},
  weekRevenue(){return DB.sum('sales',s=>isThisWeek(s.date),'total')},
  monthRevenue(){return DB.sum('sales',s=>isThisMonth(s.date),'total')},
  totalTransactions(){return DB.count('sales',s=>isThisMonth(s.date))},
  totalProductsSold(){return DB.get('sales').reduce((t,s)=>t+(s.details||[]).reduce((a,d)=>a+d.qty,0),0)},
  totalExpenses(){return DB.sum('expenses',e=>isThisMonth(e.date),'amount')},
  grossProfit(){const sales=DB.query('sales',s=>isThisMonth(s.date));return sales.reduce((t,s)=>t+s.total-(s.details||[]).reduce((a,d)=>a+(d.costPrice||0)*d.qty,0),0)},
  netProfit(){return this.grossProfit()-this.totalExpenses()},
  bestSeller(){const map={};DB.get('sales').forEach(s=>(s.details||[]).forEach(d=>{map[d.name]=(map[d.name]||0)+d.qty}));const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);return sorted[0]?sorted[0]:['-',0]},
  cashBalance(){const tx=DB.get('cash_transactions');return tx.length?tx[tx.length-1].balance:0},
  inventoryValue(){return DB.get('ingredients').reduce((t,i)=>t+i.price*i.stock,0)},
  peakHour(){const hours={};DB.get('sales').forEach(s=>{const h=new Date(s.date).getHours()+':'+String(new Date(s.date).getMinutes()).padStart(2,'0');hours[h]=(hours[h]||0)+s.total});const sorted=Object.entries(hours).sort((a,b)=>b[1]-a[1]);return sorted[0]?sorted[0]:['-',0]},
  biggestExpense(){const map={};DB.get('expenses').forEach(e=>{map[e.category]=(map[e.category]||0)+e.amount});const sorted=Object.entries(map).sort((a,b)=>b[1]-a[1]);return sorted[0]?sorted[0]:['-',0]}
};

// ==================== CHART MANAGEMENT ====================
let _charts={};
function destroyChart(id){if(_charts[id]){_charts[id].destroy();delete _charts[id]}}

function initPageHooks(){
  destroyChart('chart-sales');
  destroyChart('chart-profit');
  destroyChart('chart-cat');
  destroyChart('chart-expense');
  destroyChart('chart-owner-rev');
  destroyChart('chart-owner-profit');

  const salesCanvas=document.getElementById('chart-sales');
  const profitCanvas=document.getElementById('chart-profit');

  if(salesCanvas){
    const labels=[],salesData=[];
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      labels.push(d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}));
      salesData.push(DB.sum('sales',s=>s.date&&s.date.slice(0,10)===ds,'total'));
    }
    _charts['chart-sales']=new Chart(salesCanvas,{
      type:'bar',
      data:{labels,datasets:[{label:'Penjualan',data:salesData,backgroundColor:'rgba(220,38,38,0.8)',borderRadius:6}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rp '+(v/1000)+'k'}},x:{grid:{display:false}}}}
    });
  }

  if(profitCanvas){
    const labels=[],profitData=[];
    for(let i=6;i>=0;i--){
      const d=new Date();d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      labels.push(d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}));
      const daySales=DB.query('sales',s=>s.date&&s.date.slice(0,10)===ds);
      const rev=daySales.reduce((t,s)=>t+s.total,0);
      const cost=daySales.reduce((t,s)=>t+(s.details||[]).reduce((a,d)=>a+(d.costPrice||0)*d.qty,0),0);
      profitData.push(rev-cost);
    }
    _charts['chart-profit']=new Chart(profitCanvas,{
      type:'line',
      data:{labels,datasets:[{label:'Laba',data:profitData,borderColor:'#16a34a',backgroundColor:'rgba(22,163,74,0.1)',fill:true,tension:0.4,pointRadius:4,pointBackgroundColor:'#16a34a'}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rp '+(v/1000)+'k'}},x:{grid:{display:false}}}}
    });
  }

  // Reports charts
  const catCanvas=document.getElementById('chart-cat');
  if(catCanvas){
    const cats=DB.get('categories');
    const catData=cats.map(c=>{
      const prods=DB.query('products',p=>p.categoryId===c.id);
      return DB.get('sales').reduce((t,s)=>t+(s.details||[]).filter(d=>prods.some(p=>p.id===d.productId)).reduce((a,d)=>a+d.subtotal,0),0);
    });
    _charts['chart-cat']=new Chart(catCanvas,{
      type:'doughnut',
      data:{labels:cats.map(c=>c.name),datasets:[{data:catData,backgroundColor:['#dc2626','#f59e0b','#16a34a','#2563eb','#8b5cf6']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11}}}}}
    });
  }

  const expCanvas=document.getElementById('chart-expense');
  if(expCanvas){
    const map={};
    DB.get('expenses').forEach(e=>{map[e.category]=(map[e.category]||0)+e.amount});
    const labels=Object.keys(map);
    const data=Object.values(map);
    _charts['chart-expense']=new Chart(expCanvas,{
      type:'pie',
      data:{labels,datasets:[{data,backgroundColor:['#dc2626','#f59e0b','#16a34a','#2563eb','#8b5cf6','#ec4899']}]},
      options:{responsive:true,maintainAspectRatio:false,plugins:{legend:{position:'right',labels:{font:{size:11}}}}}
    });
  }

  // Owner dashboard charts
  const ownerRevCanvas=document.getElementById('chart-owner-rev');
  if(ownerRevCanvas){
    const labels=[],data=[];
    for(let i=29;i>=0;i-=3){
      const d=new Date();d.setDate(d.getDate()-i);
      const ds=d.toISOString().slice(0,10);
      labels.push(d.toLocaleDateString('id-ID',{day:'2-digit',month:'short'}));
      data.push(DB.sum('sales',s=>s.date&&s.date.slice(0,10)>=ds&&s.date.slice(0,10)<=today(),'total'));

      options:{responsive:true,maintainAspectRatio:false,scales:{y:{beginAtZero:true,ticks:{callback:v=>'Rp '+(v/1000)+'k'}},x:{grid:{display:false}}}}
    });
  }

  // QRIS
  const qrisDiv=document.getElementById('qris-canvas');
  if(qrisDiv){
    const settings=DB.getOne('ci_settings')||{};
    const url=settings.qrisUrl||'https://example.com/qris/cilok-ibun';

function doLogin(){
  const u=document.getElementById('login-user').value.trim();

function autoCalcMargin(){
  const c=Number(document.getElementById('f-pcost').value)||0;
  const s=Number(document.getElementById('f-pprice').value)||0;
  document.getElementById('f-margin').textContent=Calc.margin(s,c)+'%';
}
function saveProduct(id){
  const data={
    code:document.getElementById('f-pcode').value.trim(),
    name:document.getElementById('f-pname').value.trim(),
    categoryId:Number(document.getElementById('f-pcat').value),
    costPrice:Number(document.getElementById('f-pcost').value)||0,
    sellPrice:Number(document.getElementById('f-pprice').value)||0,
    margin:Calc.margin(Number(document.getElementById('f-pprice').value),Number(document.getElementById('f-pcost').value)),
    stock:Number(document.getElementById('f-pstock').value)||0,
    active:document.getElementById('f-pactive').value==='true'
  };
  if(!data.name)return toast('Nama produk wajib diisi','error');
  if(id){DB.update('products',id,data);logActivity('Edit Produk',data.name)}else{DB.add('products',data);logActivity('Tambah Produk',data.name)}
  closeModal();toast(id?'Produk diperbarui':'Produk ditambahkan');renderApp();
}
function deleteProduct(id){
  const p=DB.find('products',id);if(!p)return;
  confirmDialog('Hapus produk "'+p.name+'"?',()=>{DB.remove('products',id);logActivity('Hapus Produk',p.name);toast('Produk dihapus');renderApp()});
}

function addRecipeDetail(){

function saveRecipe(id){
  const productId=Number(document.getElementById('f-rprod').value);
  const rows=document.getElementById('recipe-details').children;
  const details=[];
  for(let i=0;i<rows.length;i++){
    const ingId=Number(rows[i].querySelector('[data-ridx]').value);
    const qty=Number(rows[i].querySelector('[data-rqty]').value)||0;
    const unit=rows[i].querySelector('[data-runit]').value;
    if(ingId&&qty>0)details.push({ingredientId:ingId,qty,unit});
  }
  if(!productId||!details.length)return toast('Pilih produk dan minimal 1 bahan','error');
  if(id){DB.update('recipes',id,{productId,details});logActivity('Edit Resep','Produk #'+productId)}else{DB.add('recipes',{productId,details});logActivity('Tambah Resep','Produk #'+productId)}
  closeModal();toast(id?'Resep diperbarui':'Resep ditambahkan');renderApp();
}
function deleteRecipe(id){

}

          '<button class="btn btn-success" style="justify-content:center" onclick="processPayment(\'tunai\')"><i class="fas fa-money-bill"></i> Tunai</button>'+

function addToCart(productId){
  const p=DB.find('products',productId);if(!p)return;
  const existing=posCart.find(c=>c.productId===productId);
  if(existing){if(existing.qty>=p.stock)return toast('Stok tidak cukup','warning');existing.qty++}
  else{if(p.stock<=0)return toast('Stok habis','warning');posCart.push({productId,id:p.id,name:p.name,price:p.sellPrice,costPrice:p.costPrice,qty:1,maxStock:p.stock})}
  renderApp();
}
function updateCartQty(idx,delta){
  posCart[idx].qty+=delta;
  const p=DB.find('products',posCart[idx].productId);
  if(posCart[idx].qty<=0)posCart.splice(idx,1);
  else if(p&&posCart[idx].qty>p.stock){posCart[idx].qty=p.stock;toast('Stok tidak cukup','warning')}
  renderApp();
}
function removeFromCart(idx){posCart.splice(idx,1);renderApp()}

function processPayment(method){
  if(!posCart.length)return toast('Keranjang kosong','error');
  const subtotal=posCart.reduce((t,c)=>t+c.price*c.qty,0);
  const total=subtotal;
  if(method==='tunai'){
    showModal('Pembayaran Tunai',
      '<div style="text-align:center;margin-bottom:20px"><div style="font-size:14px;color:var(--text2)">Total yang harus dibayar</div><div style="font-family:Space Grotesk;font-weight:800;font-size:32px;color:#dc2626">'+fmt(total)+'</div></div>'+
      '<div><label class="field-label">Uang Diterima</label><input class="input" id="f-cash" type="number" style="font-size:18px;font-weight:700;text-align:center" oninput="calcChange()" autofocus></div>'+
      '<div id="change-display" style="text-align:center;margin-top:12px;font-size:14px;color:var(--text2)"></div>'+
      '<div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;justify-content:center">'+
        [total,Math.ceil(total/5000)*5000,Math.ceil(total/10000)*10000,50000,100000].filter((v,i,a)=>a.indexOf(v)===i).map(v=>'<button class="btn btn-sm btn-outline" onclick="document.getElementById(\'f-cash\').value='+v+';calcChange()">'+fmt(v)+'</button>').join('')+
      '</div>',
      '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-success" id="btn-pay-cash" onclick="finalizeSale(\'tunai\')"><i class="fas fa-check"></i> Proses</button>');
    setTimeout(()=>{const el=document.getElementById('f-cash');if(el)el.focus()},100);
  }else{
    confirmDialog('Konfirmasi pembayaran QRIS sebesar '+fmt(total)+'?',()=>finalizeSale('qris'));
  }
}
function calcChange(){
  const total=posCart.reduce((t,c)=>t+c.price*c.qty,0);
  const cash=Number(document.getElementById('f-cash').value)||0;
  const change=cash-total;
  const display=document.getElementById('change-display');
  const btn=document.getElementById('btn-pay-cash');
  if(change>=0){display.innerHTML='Kembalian: <strong style="color:#16a34a;font-size:18px">'+fmt(change)+'</strong>';if(btn)btn.disabled=false}
  else{display.innerHTML='<span style="color:#dc2626">Uang kurang '+fmt(Math.abs(change))+'</span>';if(btn)btn.disabled=true}
}
function finalizeSale(method){
  const subtotal=posCart.reduce((t,c)=>t+c.price*c.qty,0);
  const total=subtotal;
  let cashReceived=total,change=0;
  if(method==='tunai'){
    cashReceived=Number(document.getElementById('f-cash').value)||0;
    change=cashReceived-total;
    if(change<0)return toast('Uang kurang','error');
  }
  const saleId=DB.nextId('sales');
  const details=posCart.map(c=>({productId:c.productId,name:c.name,qty:c.qty,price:c.price,costPrice:c.costPrice,subtotal:c.price*c.qty}));

  // Kurangi stok produk
  posCart.forEach(c=>{
    const p=DB.find('products',c.productId);
    if(p)DB.update('products',c.productId,{stock:Math.max(0,p.stock-c.qty)});
  });

  // Kurangi stok bahan berdasarkan resep
  posCart.forEach(c=>{
    const recipe=DB.find('recipes',r=>r.productId===c.productId);
    if(recipe&&recipe.details){
      recipe.details.forEach(d=>{
        const ing=DB.find('ingredients',d.ingredientId);
        if(ing){
          const used=d.qty*c.qty;
          DB.update('ingredients',d.ingredientId,{stock:Math.max(0,parseFloat((ing.stock-used).toFixed(3)))});
          DB.add('stock_movements',{date:new Date().toISOString(),type:'keluar',ingredientId:d.ingredientId,ingredientName:ing.name,qty:used,note:'Penjualan #'+saleId});
        }
      });
    }
  });

  // Simpan penjualan
  DB.add('sales',{date:new Date().toISOString(),subtotal,discount:0,total,paymentMethod:method,cashReceived,change,note:'',userId:Auth.user().id,details});

  // Catat kas
  const lastTx=DB.get('cash_transactions');
  const lastBalance=lastTx.length?lastTx[lastTx.length-1].balance:0;
  DB.add('cash_transactions',{date:new Date().toISOString(),type:'masuk',category:'Penjualan',description:'Penjualan #'+saleId,amount:total,balance:lastBalance+total});

  logActivity('Penjualan','Penjualan #'+saleId+' '+fmt(total)+' ('+method+')');
  posCart=[];
  closeModal();
  showReceipt(saleId,details,total,method,cashReceived,change);
}

function showReceipt(saleId,details,total,method,cashReceived,change){
  const settings=DB.getOne('ci_settings')||{};
  showModal('Struk Penjualan',
    '<div class="receipt-print" id="receipt-content">'+
      '<div class="center" style="font-weight:bold;font-size:14px">'+(settings.storeName||'Cilok Ibun')+'</div>'+
      '<div class="center" style="font-size:11px">'+(settings.address||'')+'</div>'+
      '<div class="center" style="font-size:11px">'+(settings.phone||'')+'</div>'+
      '<div class="line"></div>'+
      '<div>#'+saleId+' | '+fmtDT(new Date().toISOString())+'</div>'+
      '<div class="line"></div>'+
      details.map(d=>'<div>'+d.name+'</div><div style="display:flex;justify-content:space-between"><span>&nbsp;&nbsp;'+d.qty+' x '+fmt(d.price)+'</span><span>'+fmt(d.subtotal)+'</span></div>').join('')+
      '<div class="line"></div>'+
      '<div style="display:flex;justify-content:space-between;font-weight:bold"><span>TOTAL</span><span>'+fmt(total)+'</span></div>'+
      '<div style="font-size:11px">Metode: '+(method==='tunai'?'Tunai':'QRIS')+'</div>'+
      (method==='tunai'?'<div style="font-size:11px">Dibayar: '+fmt(cashReceived)+'</div><div style="font-size:11px">Kembali: '+fmt(change)+'</div>':'')+
      '<div class="line"></div>'+
      '<div class="center" style="font-size:11px">Terima Kasih!</div>'+
    '</div>',
    '<button class="btn btn-outline" onclick="closeModal();renderApp()">Tutup</button>'+
    '<button class="btn btn-primary" onclick="printElement(\'receipt-content\')"><i class="fas fa-print"></i> Cetak</button>');
}

function showPackageForm(id){
  const pkg=id?DB.find('package_menu',id):{name:'',items:[],normalPrice:0,packagePrice:0};
  const prods=DB.get('products');
  showModal(id?'Edit Paket':'Tambah Paket',
    '<div style="display:grid;gap:14px">'+
      '<div><label class="field-label">Nama Paket</label><input class="input" id="f-pkgname" value="'+pkg.name+'"></div>'+
      '<div><label class="field-label">Produk dalam Paket</label><div style="display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px">'+
        prods.map(p=>'<label style="display:inline-flex;align-items:center;gap:4px;padding:4px 10px;background:var(--surface);border-radius:6px;font-size:12px;cursor:pointer"><input type="checkbox" class="pkg-item-cb" value="'+p.id+'" '+(pkg.items&&pkg.items.some(i=>i.productId===p.id)?'checked':'')+'> '+p.name+'</label>').join('')+
      '</div></div>'+
      '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px">'+
        '<div><label class="field-label">Harga Normal</label><input class="input" id="f-pkgnormal" type="number" value="'+pkg.normalPrice+'"></div>'+
        '<div><label class="field-label">Harga Paket</label><input class="input" id="f-pkgprice" type="number" value="'+pkg.packagePrice+'"></div>'+
      '</div>'+
    '</div>',
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="savePackage('+(id||0)+')">Simpan</button>');
}
function savePackage(id){
  const name=document.getElementById('f-pkgname').value.trim();
  if(!name)return toast('Nama paket wajib diisi','error');
  const cbs=document.querySelectorAll('.pkg-item-cb:checked');
  const items=[];cbs.forEach(cb=>{const p=DB.find('products',Number(cb.value));if(p)items.push({productId:p.id,name:p.name,price:p.sellPrice})});
  const normalPrice=items.reduce((t,i)=>t+i.price,0);
  const packagePrice=Number(document.getElementById('f-pkgprice').value)||0;
  const data={name,items,normalPrice,packagePrice};
  if(id){DB.update('package_menu',id,data)}else{DB.add('package_menu',data)}
  closeModal();toast(id?'Paket diperbarui':'Paket ditambahkan');renderApp();
}
function deletePackage(id){confirmDialog('Hapus paket ini?',()=>{DB.remove('package_menu',id);toast('Paket dihapus');renderApp()})}

  '<div class="card"><div class="table-wrap"><table><thead><tr><th>Username</th><th>Nama</th><th>Role</th><th>Status</th><th>Aksi</th></tr></thead><tbody>'+
  users.map(u=>
    '<tr><td style="font-family:monospace">'+u.username+'</td><td style="font-weight:600">'+u.name+'</td><td><span class="badge badge-blue" style="text-transform:capitalize">'+u.role+'</span></td><td><span class="badge '+(u.active?'badge-green':'badge-red')+'">'+(u.active?'Aktif':'Nonaktif')+'</span></td><td style="white-space:nowrap"><button class="btn btn-sm btn-outline" onclick="showUserForm('+u.id+')"><i class="fas fa-pen"></i></button> '+(u.id!==1?'<button class="btn btn-sm btn-danger" onclick="deleteUser('+u.id+')"><i class="fas fa-trash"></i></button>':'')+'</td></tr>'
  ).join('')+
  '</tbody></table></div></div>';
}
function showUserForm(id){
  const u=id?DB.find('users',id):{username:'',password:'',name:'',role:'karyawan',active:true};
  showModal(id?'Edit User':'Tambah User',
    '<div style="display:grid;gap:14px">'+
      '<div><label class="field-label">Username</label><input class="input" id="f-uname" value="'+u.username+'" '+(id?'readonly style="opacity:.6"':'')+'></div>'+
      '<div><label class="field-label">'+(id?'Password (kosongkan jika tidak diubah)':'Password')+'</label><input class="input" type="password" id="f-upass" value="'+(id?'':'')+'"></div>'+
      '<div><label class="field-label">Nama Lengkap</label><input class="input" id="f-ufull" value="'+u.name+'"></div>'+
      '<div><label class="field-label">Role</label><select class="input" id="f-urole">'+['owner','kasir','karyawan'].map(r=>'<option value="'+r+'" '+(u.role===r?'selected':'')+' style="text-transform:capitalize">'+r+'</option>').join('')+'</select></div>'+
      '<div><label class="field-label">Status</label><select class="input" id="f-uactive"><option value="true" '+(u.active!==false?'selected':'')+'>Aktif</option><option value="false" '+(u.active===false?'selected':'')+'>Nonaktif</option></select></div>'+
    '</div>',
    '<button class="btn btn-outline" onclick="closeModal()">Batal</button><button class="btn btn-primary" onclick="saveUser('+(id||0)+')">Simpan</button>');
}
function saveUser(id){
  const username=document.getElementById('f-uname').value.trim();
  const name=document.getElementById('f-ufull').value.trim();
  if(!username||!name)return toast('Username dan nama wajib diisi','error');
  const data={name,role:document.getElementById('f-urole').value,active:document.getElementById('f-uactive').value==='true'};
  const pass=document.getElementById('f-upass').value;
  if(!id){
    if(!pass)return toast('Password wajib diisi','error');
    data.username=username;data.password=pass;
    DB.add('users',data);logActivity('Tambah User',name);
  }else{
    if(pass)data.password=pass;
    DB.update('users',id,data);logActivity('Edit User',name);
  }
  closeModal();toast(id?'User diperbarui':'User ditambahkan');renderApp();
}
function deleteUser(id){
  if(id===1)return toast('Tidak bisa hapus owner utama','error');
  const u=DB.find('users',id);
  confirmDialog('Hapus user "'+u.name+'"?',()=>{DB.remove('users',id);logActivity('Hapus User',u.name);toast('User dihapus');renderApp()});
}

// ==================== ACTIVITY LOG ====================
function renderActivity(){
  const logs=DB.get('activity_log');
  return '<div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px;flex-wrap:wrap;gap:8px">'+
    '<input class="input" style="max-width:300px" placeholder="Cari aktivitas..." oninput="filterTable(this,\'act-table\')">'+
    '<p style="color:var(--text2);font-size:13px">'+logs.length+' catatan</p>'+
  '</div>'+
  '<div class="card" id="act-table"><div class="table-wrap"><table><thead><tr><th>Waktu</th><th>User</th><th>Aksi</th><th>Detail</th></tr></thead><tbody>'+
  logs.slice(-50).reverse().map(l=>
    '<tr data-search="'+l.userName.toLowerCase()+' '+l.action.toLowerCase()+' '+(l.detail||'').toLowerCase()+'">'+
      '<td style="white-space:nowrap">'+fmtDT(l.createdAt||l.date)+'</td>'+
      '<td style="font-weight:600">'+l.userName+'</td>'+
      '<td><span class="badge badge-blue">'+l.action+'</span></td>'+
      '<td style="max-width:300px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">'+(l.detail||'-')+'</td>'+
    '</tr>'
  ).join('')+
  (logs.length===0?'<tr><td colspan="4" style="text-align:center;color:var(--text2)">Belum ada aktivitas</td></tr>':'')+
  '</tbody></table></div></div>';
}

// ==================== SETTINGS ====================
function renderSettings(){
  const s=DB.getOne('ci_settings')||{};
  return '<div style="max-width:600px">'+
    '<div class="card" style="padding:24px;margin-bottom:16px">'+
      '<h3 style="font-weight:700;margin-bottom:20px;font-size:16px"><i class="fas fa-store" style="color:#dc2626;margin-right:6px"></i> Informasi Toko</h3>'+
      '<div style="display:grid;gap:14px">'+
        '<div><label class="field-label">Nama Toko</label><input class="input" id="f-sname" value="'+(s.storeName||'')+'"></div>'+
        '<div><label class="field-label">Tagline</label><input class="input" id="f-stagline" value="'+(s.tagline||'')+'"></div>'+
        '<div><label class="field-label">Alamat</label><input class="input" id="f-saddr" value="'+(s.address||'')+'"></div>'+
        '<div><label class="field-label">Telepon</label><input class="input" id="f-sphone" value="'+(s.phone||'')+'"></div>'+
        '<div><label class="field-label">Modal Awal</label><input class="input" id="f-scapital" type="number" value="'+(s.initialCapital||0)+'"></div>'+
        '<button class="btn btn-primary" onclick="saveSettings()"><i class="fas fa-save"></i> Simpan Pengaturan</button>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="padding:24px;margin-bottom:16px">'+
      '<h3 style="font-weight:700;margin-bottom:20px;font-size:16px"><i class="fas fa-database" style="color:#f59e0b;margin-right:6px"></i> Backup & Restore</h3>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-outline" onclick="exportJSON()"><i class="fas fa-download"></i> Backup JSON</button>'+
        '<label class="btn btn-outline" style="cursor:pointer"><i class="fas fa-upload"></i> Restore JSON<input type="file" accept=".json" style="display:none" onchange="importJSON(this.files[0])"></label>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="padding:24px;margin-bottom:16px">'+
      '<h3 style="font-weight:700;margin-bottom:20px;font-size:16px"><i class="fas fa-cloud" style="color:#2563eb;margin-right:6px"></i> Firebase</h3>'+
      '<div style="display:grid;gap:14px">'+
        '<div><label class="field-label">Firebase API Key</label><input class="input" id="f-fb-key" placeholder="AIzaSy..." value="'+(s.fbKey||'')+'"></div>'+
        '<div><label class="field-label">Firebase Database URL</label><input class="input" id="f-fb-url" placeholder="https://xxx.firebaseio.com" value="'+(s.fbUrl||'')+'"></div>'+
        '<div><label class="field-label">Firebase Project ID</label><input class="input" id="f-fb-proj" placeholder="my-project-id" value="'+(s.fbProject||'')+'"></div>'+
        '<div style="display:flex;gap:8px">'+
          '<button class="btn btn-primary" onclick="connectFirebase()"><i class="fas fa-plug"></i> Hubungkan</button>'+
          (DB.isFirebase()?'<button class="btn btn-danger" onclick="disconnectFirebase()"><i class="fas fa-unlink"></i> Putuskan</button>':'')+
          '<span style="display:flex;align-items:center;gap:6px;font-size:13px;color:var(--text2)"><span class="pulse-dot" style="background:'+(DB.isFirebase()?'#16a34a':'#dc2626')+'"></span>'+(DB.isFirebase()?'Terhubung Firebase':'Mode Lokal (localStorage)')+'</span>'+
        '</div>'+
      '</div>'+
    '</div>'+
    '<div class="card" style="padding:24px">'+
      '<h3 style="font-weight:700;margin-bottom:20px;font-size:16px;color:#dc2626"><i class="fas fa-triangle-exclamation" style="margin-right:6px"></i> Zona Berbahaya</h3>'+
      '<div style="display:flex;gap:8px;flex-wrap:wrap">'+
        '<button class="btn btn-danger" onclick="resetAllData()"><i class="fas fa-trash"></i> Reset Semua Data</button>'+
      '</div>'+
      '<p style="font-size:12px;color:var(--text2);margin-top:8px">Menghapus seluruh data lokal dan memulai dari awal. Pastikan sudah backup.</p>'+
    '</div>'+
  '</div>';
}
function saveSettings(){
  const s={
    storeName:document.getElementById('f-sname').value.trim(),
    tagline:document.getElementById('f-stagline').value.trim(),
    address:document.getElementById('f-saddr').value.trim(),
    phone:document.getElementById('f-sphone').value.trim(),
    initialCapital:Number(document.getElementById('f-scapital').value)||0,
    qrisUrl:(DB.getOne('ci_settings')||{}).qrisUrl||'',
    fbKey:document.getElementById('f-fb-key')?.value.trim()||'',
    fbUrl:document.getElementById('f-fb-url')?.value.trim()||'',
    fbProject:document.getElementById('f-fb-proj')?.value.trim()||''
  };
  DB.setOne('ci_settings',s);
  logActivity('Update Settings','Pengaturan toko diperbarui');
  toast('Pengaturan disimpan');renderApp();
}
async function connectFirebase(){
  const key=document.getElementById('f-fb-key').value.trim();
  const url=document.getElementById('f-fb-url').value.trim();
  const proj=document.getElementById('f-fb-proj').value.trim();
  if(!key||!url||!proj)return toast('Isi semua field Firebase','error');
  toast('Menghubungkan ke Firebase...','info');
  const ok=await DB.connect({apiKey:key,authDomain:proj+'.firebaseapp.com',databaseURL:url,projectId:proj,storageBucket:proj+'.appspot.com',messagingSenderId:'',appId:''});
  if(ok){
    const s=DB.getOne('ci_settings')||{};s.fbKey=key;s.fbUrl=url;s.fbProject=proj;DB.setOne('ci_settings',s);
    toast('Firebase terhubung!');
    logActivity('Firebase','Terhubung ke Firebase');
    renderApp();
  }else{
    toast('Gagal terhubung ke Firebase','error');
  }
}
function disconnectFirebase(){
  DB.disconnect();
  logActivity('Firebase','Firebase diputuskan');
  toast('Firebase diputuskan, kembali ke mode lokal');renderApp();
}
function resetAllData(){
  confirmDialog('PERINGATAN: Semua data akan dihapus permanen. Yakin?',()=>{
    DB._TABLES.forEach(t=>{DB._cache[t]=[];localStorage.removeItem('ci_'+t)});
    localStorage.removeItem('ci_seeded');localStorage.removeItem('ci_session');
    toast('Data direset');setTimeout(()=>location.reload(),500);
  });
}

// ==================== INIT ====================
(async function init(){
  // Dark mode
  if(DB.getOne('ci_dark')==='true')document.documentElement.classList.add('dark');
  // Seed data
  await seedData();
  // Initial render
  renderApp();
})();
</script>
</body>
</html>
